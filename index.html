<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Secret Santa · 시크릿 산타</title>
  <meta name="description" content="Create a Secret Santa group, share a code, and keep wishlists in one place.">
  <meta name="theme-color" content="#2c3a49">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="style.css?v=25">
</head>
<body>
  <header class="site-header">
    <h1 class="brand" id="brand" role="link" tabindex="0" title="Home / 홈">
      <svg class="brand-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M5 12v8a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-8M12 8v13M12 8c-1.5-3-5-3.5-5-1.2C7 8 9.5 8 12 8zm0 0c1.5-3 5-3.5 5-1.2C17 8 14.5 8 12 8z"/></svg>
      <span class="en">Secret Santa</span><span class="ko">시크릿 산타</span>
    </h1>
    <div class="header-actions">
      <div class="account-wrap">
        <button class="icon-btn" id="account" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="account-menu" aria-label="Account / 계정">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
        </button>
        <div class="account-menu" id="account-menu" role="menu" hidden></div>
      </div>
      <button class="lang-toggle" id="lang" type="button" aria-label="Change language / 언어 변경">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
        <span class="en">English</span><span class="ko">한국어</span>
      </button>
    </div>
  </header>

  <main id="app" aria-live="polite">
    <div class="loading"><span class="spinner" aria-label="Loading"></span></div>
  </main>


  <noscript>
    <p class="noscript">This app needs JavaScript turned on.<br>이 앱을 사용하려면 자바스크립트를 켜야 합니다.</p>
  </noscript>

  <script type="module" src="app.js?v=25"></script>
</body>
</html>
